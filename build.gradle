plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.caestro'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

jar {
	enabled = false
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// JWT
	implementation("io.jsonwebtoken:jjwt-api:0.12.3")
	runtimeOnly("io.jsonwebtoken:jjwt-impl:0.12.3")
	runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.12.3")

	// HTTP 클라이언트 - 카카오 API 호출용
	implementation("org.springframework.boot:spring-boot-starter-webflux")

	// Swagger
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4")

	// WebSocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// 구글 ID token 로컬 검증 (모바일 Google Sign-In)
	implementation("com.google.api-client:google-api-client:2.7.0")

	// AWS Secrets Manager (런타임 시크릿 주입) — Spring Cloud AWS 4.x (Boot 4.x 대응)
	implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:4.1.0")
	implementation "io.awspring.cloud:spring-cloud-aws-starter-secrets-manager"

	// ShedLock — 다중 인스턴스 스케줄러 중복 실행 방지 (기존 Redis를 락 저장소로 사용)
	implementation "net.javacrumbs.shedlock:shedlock-spring:6.6.0"
	implementation "net.javacrumbs.shedlock:shedlock-provider-redis-spring:6.6.0"

	// resilience4j — 세션 기록 워커의 일시 오류 재시도 (#124). 프로그래매틱 사용이라 스타터/AOP 불필요
	implementation "io.github.resilience4j:resilience4j-retry:2.2.0"
	// resilience4j — 외부 API 서킷브레이커 + 상태 지표 Micrometer 노출 (#125)
	implementation "io.github.resilience4j:resilience4j-circuitbreaker:2.2.0"
	implementation "io.github.resilience4j:resilience4j-micrometer:2.2.0"

	// 구조화(JSON) 로그 인코더 — prod 프로파일 전용, CloudWatch Logs Insights 필드 질의용 (#131)
	implementation "net.logstash.logback:logstash-logback-encoder:8.1"
}

// /actuator/info 에 버전·빌드시각 노출 (META-INF/build-info.properties 생성)
springBoot {
	buildInfo()
}

tasks.named('test') {
	useJUnitPlatform()
}
