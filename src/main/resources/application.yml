spring:
  profiles:
    active: dev
  cloud:
    aws:
      region:
        static: ap-northeast-2
  lifecycle:
    # 종료 단계별 허용 시간. WS 드레인(jitter+대기)과 HTTP graceful이 끝날 여유 — docker stop-timeout(30s)과 맞춘다
    timeout-per-shutdown-phase: 30s

# 공통 Actuator 설정 (노출 범위/show-details는 프로파일에서 override)
management:
  endpoints:
    web:
      exposure:
        # prometheus: 커스텀 WS 지표 노출. 보안은 SecurityConfig의 anyRequest().authenticated()가 담당
        # (JWT 없는 외부 요청은 401 — 헬스체크와 달리 permitAll 목록에 넣지 않는다)
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, redis
  info:
    env:
      enabled: true

info:
  app:
    name: Caestro
    description: 듀얼 디바이스 협업 촬영 앱 백엔드

# 시그널링 하트비트/유휴 소켓 정리 설정
signaling:
  heartbeat:
    max-idle-ms: 90000
    reaper-interval-ms: 30000
  # 배포·종료 시 WS 드레인 (#106): 1012 close를 jitter 폭에 흩뿌려 재접속 몰림을 막고, 전부 닫히길 max-wait까지 기다린다
  drain:
    jitter-ms: 3000
    max-wait-ms: 10000
    # ALB 등록 해제 감지 (#111): ASG 인스턴스는 IMDS target-lifecycle-state를 폴링해 Terminated면 SIGTERM보다 먼저 드레인.
    # 운영 실측에서 ALB가 등록 해제 지연 만료 시 소켓을 먼저 끊어 SIGTERM 드레인이 무효였다. 로컬/CI엔 IMDS가 없어 기본 off.
    imds:
      enabled: false
      poll-ms: 2000
      base-url: http://169.254.169.254

# 만료 데이터 정리 배치 설정
cleanup:
  session:
    retention-days: 30        # 생성 후 이 기간이 지난 세션을 정리
    cron: "0 0 4 * * *"       # 매일 새벽 4시
  fill:
    cron: "0 30 4 * * *"      # 만료된 함께 채우기 세션(사진 포함) 정리
  catalog:
    cron: "0 50 4 * * *"      # 스튜디오에서 올리고 저장하지 않은 그림(하루 지난 것)과 기한 지난 휴지통 항목 정리

# 함께 채우기 (#fill-together): 사진은 DB(fill_images)에 두고 만료 뒤 배치가 지운다
fill:
  public-base-url: https://api.peakpic.app   # 이미지 URL의 호스트 (ALB 뒤에서는 요청 스킴을 믿을 수 없어 고정)
  ttl-days: 7
  max-image-bytes: 3145728
  max-gif-bytes: 16777216   # 완성 네컷 GIF(앱이 링크 공유 시 올림)
  max-clip-bytes: 6291456   # 칸 클립 GIF(앱 안 카메라로 채울 때 사진과 함께 찍힌 움직임)
  queue-max: 12             # 칸에서 밀려난 사진의 대기열 상한(세션당). 넘치면 가장 오래된 것부터 사라진다
  max-active-sessions: 20   # 사용자당 만료 전 세션 상한 (#150) — 속도가 아닌 총량
  image-store: rds          # rds | s3. 운영은 prod yml에서 s3 (#152). 바이트 위치만 다르고 주소 형식은 같다
  s3:
    bucket: peakpic-fill-images-063562646825
    key-prefix: fills       # 객체 키 = {prefix}/{sessionId}/{imageId} — 세션 단위 삭제·집계를 접두사로 한다
    presign-minutes: 10     # 이미지 GET은 이 수명의 서명 주소로 302. 짧을수록 유출 창이 짧다
  ratelimit:                # 사용자(토큰) 단위 고정 창. 추정치이며 fill.rate_limited 지표로 교정한다 (#150)
    create-limit: 10
    create-window-seconds: 3600
    upload-limit: 30          # 칸 사진·프레임 요소·GIF 합산
    upload-window-seconds: 60

# 카탈로그(디자이너 스튜디오, contracts/catalog-studio.md): 서버에서 내려주는 AI 네컷 프레임·홈 배너
catalog:
  studio-key: ""              # peakpic.app/studio 가 X-Studio-Key 로 보내는 키. 비면 스튜디오(쓰기) 전체 403. 운영은 prod yml/Secret
  max-image-bytes: 8388608    # 프레임 PNG·배너 그림 상한(8MB)
  max-video-bytes: 15728640   # 홈 배너 동영상(MP4) 상한(15MB). catalog_images LONGBLOB 에 같이 두므로 RDS max_allowed_packet(기본 64MB)보다 작게
  public-base-url: https://api.peakpic.app   # 그림 URL 의 호스트 (fill.public-base-url 과 같은 이유로 고정)
  trash-days: 7               # 지운 프레임·배너·포즈 사진이 휴지통에 남는 날수. 지나면 정리 배치가 완전히 지운다(포즈 덧씌우기는 숨김으로 남김)

# 브라우저 클라이언트(peakpic.app 웹에서 채우기) 허용 출처. 로컬 개발은 프로파일에서 http://localhost:포트 를 덧붙인다
cors:
  allowed-origins: https://peakpic.app,https://www.peakpic.app

---
# prod 프로파일(ASG 인스턴스)에서만 IMDS 감지를 켠다. application-prod.yml은 저장소 밖(CI Secret)이라
# 코드와 함께 추적돼야 하는 이 토글은 여기 프로파일 문서로 둔다. (반드시 파일 맨 끝에 둘 것 — 아래 키는 전부 이 문서 소속)
spring:
  config:
    activate:
      on-profile: prod
signaling:
  drain:
    imds:
      enabled: true
