spring:
  profiles:
    active: dev
  cloud:
    aws:
      region:
        static: ap-northeast-2

# 공통 Actuator 설정 (노출 범위/show-details는 프로파일에서 override)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, redis
  info:
    env:
      enabled: true

info:
  app:
    name: Caestro
    description: 듀얼 디바이스 협업 촬영 앱 백엔드

# 시그널링 하트비트/유휴 소켓 정리 설정 (시크릿 아님 → 공통 yml에서 관리, 프로파일에서 override 가능)
signaling:
  heartbeat:
    max-idle-ms: 90000
    reaper-interval-ms: 30000
