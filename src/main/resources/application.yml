spring:
  profiles:
    active: dev
  cloud:
    aws:
      region:
        static: ap-northeast-2
  lifecycle:
    # 종료 단계별 허용 시간. WS 드레인(jitter+대기)과 HTTP graceful이 끝날 여유 — docker stop-timeout(30s)과 맞춘다
    timeout-per-shutdown-phase: 30s

# 공통 Actuator 설정 (노출 범위/show-details는 프로파일에서 override)
management:
  endpoints:
    web:
      exposure:
        # prometheus: 커스텀 WS 지표 노출. 보안은 SecurityConfig의 anyRequest().authenticated()가 담당
        # (JWT 없는 외부 요청은 401 — 헬스체크와 달리 permitAll 목록에 넣지 않는다)
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, redis
  info:
    env:
      enabled: true

info:
  app:
    name: Caestro
    description: 듀얼 디바이스 협업 촬영 앱 백엔드

# 시그널링 하트비트/유휴 소켓 정리 설정
signaling:
  heartbeat:
    max-idle-ms: 90000
    reaper-interval-ms: 30000
  # 배포·종료 시 WS 드레인 (#106): 1012 close를 jitter 폭에 흩뿌려 재접속 몰림을 막고, 전부 닫히길 max-wait까지 기다린다
  drain:
    jitter-ms: 3000
    max-wait-ms: 10000

# 만료 데이터 정리 배치 설정
cleanup:
  session:
    retention-days: 30        # 생성 후 이 기간이 지난 세션을 정리
    cron: "0 0 4 * * *"       # 매일 새벽 4시
