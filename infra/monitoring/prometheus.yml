# PeakPic 지표 수집 설정.
# ASG 인스턴스는 IP가 유동적이므로 EC2 서비스 디스커버리로 자동 발견한다.
# (모니터링 EC2의 IAM 역할에 ec2:DescribeInstances 권한 필요 — 자격증명은 인스턴스 역할에서 자동 획득)

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: peakpic-backend
    metrics_path: /actuator/prometheus
    # 앱의 MetricsTokenFilter와 맞추는 정적 토큰 (파일로 주입, 레포에는 커밋하지 않음)
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8080
        filters:
          # ASG가 인스턴스에 자동으로 붙이는 태그 → 배포로 교체돼도 자동 추적
          - name: tag:aws:autoscaling:groupName
            values: [peakpic-asg]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id
      - source_labels: [__meta_ec2_availability_zone]
        target_label: az

  # B2B 축제 전용 서버(peakpic-b2b-server). 별도 VPC 라 EC2 디스커버리가 닿지 않아 공개 ALB 를 거쳐 긁는다 (#236)
  # 대상(주소·경로)은 b2b_targets.json, 운영자 키는 b2b_admin_key 에서 읽는다. 둘 다 모니터링 EC2 에만 두고 커밋하지 않는다
  # 키가 축제마다 달라 한 번에 한 축제만 긁는다. ALB 가 인스턴스 하나에 보내므로 인스턴스별 값은 CloudWatch 를 본다
  - job_name: peakpic-b2b-festival
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/b2b_admin_key
    file_sd_configs:
      - files: [/etc/prometheus/b2b_targets.json]
