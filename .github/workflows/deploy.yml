name: Deploy

# main push(= PR 병합) 시 자동 배포한다.
# 테스트는 PR 단계의 CI(ci.yml)에서 이미 검증되므로 여기서는 빌드→배포만 수행한다.
# (main 직접 push를 막고 CI 통과를 강제하려면 GitHub branch protection을 함께 설정할 것)
on:
  push:
    branches: [main]

# OIDC로 AWS 임시 자격증명을 발급받기 위해 id-token 쓰기 권한이 필요하다.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 운영 설정(application-prod.yml)은 저장소에 없고 base64 Secret으로 주입한다.
      - name: Inject production config
        run: echo "${{ secrets.APPLICATION_PROD_YML }}" | base64 --decode > src/main/resources/application-prod.yml

      # bootJar는 test 태스크에 의존하지 않으므로 DB 없이 jar만 생성된다.
      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload jar to S3
        run: aws s3 cp build/libs/*.jar s3://${{ secrets.S3_BUCKET }}/app.jar

      # 새 인스턴스가 부팅하며 S3의 최신 jar를 pull → 롤링 교체.
      # MinHealthyPercentage=100 은 "새 인스턴스가 건강해진 뒤 기존 것을 종료"(무중단)를 의미하며,
      # 이를 위해 ASG max >= 2 여야 한다. (현재 min=1, desired=1, max=2 로 충족)
      - name: Trigger ASG instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage":100,"InstanceWarmup":120}'
