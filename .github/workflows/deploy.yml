name: Deploy

# main push(= PR 병합) 시 자동 배포한다.
# 도커 이미지를 빌드해 ECR에 push하고, ASG instance refresh로 새 인스턴스가 이미지를 pull한다.
on:
  push:
    branches: [main]

# OIDC로 AWS 임시 자격증명을 발급받기 위해 id-token 쓰기 권한이 필요하다.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: peakpic-app
  # 비어 있으면(시크릿 미설정) 알림 스텝이 자동 skip 된다.
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 운영 설정(application-prod.yml, 시크릿 없음)은 저장소에 없고 base64 Secret으로 주입한다.
      # 도커 빌드가 이 파일을 이미지에 굽는다. (실제 시크릿은 런타임에 Secrets Manager에서 로드)
      - name: Inject production config
        run: echo "${{ secrets.APPLICATION_PROD_YML }}" | base64 --decode > src/main/resources/application-prod.yml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 멀티스테이지 Dockerfile로 이미지 빌드 후 ECR push.
      # cache-from/to(gha)로 GitHub Actions 캐시에 도커 레이어를 저장 → 다음 빌드 가속.
      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 새 인스턴스가 부팅하며 ECR에서 최신 이미지를 pull → 롤링 교체.
      # 완료까지 러너를 20분 붙잡지 않고, refresh를 시작만 시킨다.
      # (최종 성공 판정은 ALB 헬스체크가 하고, 진행률은 콘솔에서 확인)
      - name: Trigger ASG instance refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage":100,"InstanceWarmup":120}' \
            --query InstanceRefreshId --output text)
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
          echo "instance refresh started: $REFRESH_ID"

      # 배포 결과를 Discord에 1회 알린다. (ChatOps — 누가·무엇을 배포했고 나갔는지/실패했는지)
      # 성공 = 빌드·ECR push·instance refresh 트리거까지 완료(= 새 이미지가 롤링 반영 시작).
      # 인스턴스 교체 '완료'는 몇 분 뒤이며 ALB 헬스체크가 최종 판정한다(여기서 폴링하지 않음).
      # 알림 실패가 배포를 막지 않도록 continue-on-error.
      - name: Notify deploy result (Discord)
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REFRESH_ID: ${{ steps.refresh.outputs.refresh_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [ "$JOB_STATUS" = "success" ] && [ -n "$REFRESH_ID" ]; then
            TITLE="🚀 배포됨 · 롤링 교체 시작"; COLOR=3066993
            NOTE="새 이미지 push 완료, instance refresh 시작. 몇 분 뒤 ALB 헬스체크로 최종 반영 확인."
          else
            TITLE="❌ 배포 실패 (미반영)"; COLOR=15158332
            NOTE="빌드/푸시 또는 refresh 트리거 단계에서 실패 — 새 버전이 나가지 않았습니다. 로그 확인 필요."
          fi
          curl -sf -H "Content-Type: application/json" -X POST "$DISCORD_WEBHOOK_URL" -d @- <<JSON
          {"embeds":[{"title":"${TITLE}","description":"${NOTE}","color":${COLOR},
            "fields":[
              {"name":"커밋","value":"[\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) ${COMMIT_MSG}"},
              {"name":"actor","value":"${GITHUB_ACTOR}","inline":true},
              {"name":"실행","value":"[로그](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})","inline":true}
            ]}]}
          JSON
