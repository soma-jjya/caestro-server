name: B2B load script contracts
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'load-test/**'
      - 'src/main/java/com/caestro/server/domain/b2b/**'
      - 'src/main/java/com/caestro/server/domain/fill/**'
      - 'src/main/java/com/caestro/server/domain/auth/**'
      - 'src/main/java/com/caestro/server/global/**'
      - 'src/main/resources/**'
      - 'Dockerfile'
      - 'build.gradle'
      - '.github/workflows/b2b-load-contract.yml'
  push:
    branches: [develop]
    paths:
      - 'load-test/**'
      - 'src/main/java/com/caestro/server/domain/b2b/**'
      - 'src/main/java/com/caestro/server/domain/fill/**'
      - 'src/main/java/com/caestro/server/domain/auth/**'
      - 'src/main/java/com/caestro/server/global/**'
      - 'src/main/resources/**'
      - 'Dockerfile'
      - 'build.gradle'
      - '.github/workflows/b2b-load-contract.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline workflow and target/cleanup guards (no live API traffic)
        run: node --test load-test/k6/b2b/workflow.test.mjs
      - name: Validate isolated Compose config
        run: docker compose -f load-test/docker-compose.b2b.yml config --quiet
      - name: Generate reproducible PNG fixture
        run: python3 load-test/k6/b2b/generate-photo.py
      - name: Parse k6 entry points without sending API requests
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" -w /work -e STUDIO_KEY=ci-dummy grafana/k6:1.0.0 inspect load-test/k6/b2b-session.js
          docker run --rm --network none -v "$PWD:/work:ro" -w /work grafana/k6:1.0.0 inspect load-test/k6/b2b-shared-ip.js
  smoke:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable B2B API, MySQL and Redis
        run: |
          python3 load-test/k6/b2b/generate-photo.py
          docker compose -f load-test/docker-compose.b2b.yml up -d --build
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8081/actuator/health/readiness >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - name: One journey through real API (not a capacity benchmark)
        run: >-
          docker run --rm --network host -v "$PWD:/work:ro" -w /work
          -e STUDIO_KEY=local-b2b-studio-only -e PROFILE=smoke
          grafana/k6:1.0.0 run load-test/k6/b2b-session.js
      - name: Shared-IP guest limit and recovery against real Redis
        run: >-
          docker run --rm --network host -v "$PWD:/work:ro" -w /work
          grafana/k6:1.0.0 run load-test/k6/b2b-shared-ip.js
      - name: Diagnostic logs on failure
        if: failure()
        run: docker compose -f load-test/docker-compose.b2b.yml logs --no-color --tail 100
      - name: Stop this disposable environment
        if: always()
        run: docker compose -f load-test/docker-compose.b2b.yml down
